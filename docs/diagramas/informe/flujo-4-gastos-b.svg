<rect x="345.0" y="284.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="320.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema suma el gasto al rubro y lo</text>
<text x="560.0" y="345.5" font-size="20" fill="#ffffff" text-anchor="middle">compara con lo presupuestado en el</text>
<text x="560.0" y="370.5" font-size="20" fill="#ffffff" text-anchor="middle">definitivo aprobado</text>
<polygon points="560,449.0 725.0,534.0 560,619.0 395.0,534.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="529.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Lo gastado supera</text>
<text x="560.0" y="551.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">el 100% del rubro?</text>
<polygon points="560,675.0 720.0,755.0 560,835.0 400.0,755.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="750.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Llega al 90% del</text>
<text x="560.0" y="772.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">rubro?</text>
<rect x="430.0" y="891.0" width="260" height="60" rx="10" fill="#2e7d32" stroke="none"/>
<text x="560.0" y="927.6" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">Semáforo verde</text>
<rect x="345.0" y="1007.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1044.5" font-size="20" fill="#ffffff" text-anchor="middle">El semáforo se actualiza en la ficha de la</text>
<text x="560.0" y="1069.5" font-size="20" fill="#ffffff" text-anchor="middle">obra y en el Tablero</text>
<rect x="345.0" y="1149.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1186.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema recalcula la ganancia estimada</text>
<text x="560.0" y="1211.5" font-size="20" fill="#ffffff" text-anchor="middle">y el total de gastos hormiga</text>
<polygon points="560,1291.0 720.0,1371.0 560,1451.0 400.0,1371.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1366.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Hay un gasto mal</text>
<text x="560.0" y="1388.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">cargado?</text>
<rect x="450.0" y="1507.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="1555.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="67.0" y="504.0" width="230" height="60" rx="10" fill="#c62828" stroke="none"/>
<text x="182.0" y="540.6" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">Semáforo rojo</text>
<rect x="845.0" y="725.0" width="260" height="60" rx="10" fill="#e0a000" stroke="none"/>
<text x="975.0" y="761.6" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="bold">Semáforo amarillo</text>
<rect x="810.0" y="1328.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1365.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño lo anula indicando el</text>
<text x="975.0" y="1390.5" font-size="20" fill="#1d1d1f" text-anchor="middle">motivo y lo vuelve a cargar</text>
<rect x="810.0" y="1505.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1542.5" font-size="20" fill="#ffffff" text-anchor="middle">El gasto deja de contar y la</text>
<text x="975.0" y="1567.5" font-size="20" fill="#ffffff" text-anchor="middle">anulación queda en la auditoría</text>
<rect x="810.0" y="302.7" width="330" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="975.0" y="333.7" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Se compara contra el subtotal: ni el IVA</text>
<text x="975.0" y="354.5" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">ni los honorarios son costo de la obra</text>
<rect x="52.0" y="1135.4" width="260" height="113.2" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1166.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Un rubro que no estaba</text>
<text x="182.0" y="1187.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">presupuestado se muestra sin</text>
<text x="182.0" y="1208.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">semáforo, como gasto no</text>
<text x="182.0" y="1228.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">previsto</text>
