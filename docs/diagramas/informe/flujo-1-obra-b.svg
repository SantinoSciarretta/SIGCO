<circle cx="560" cy="198.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="206.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="345.0" y="284.0" width="430" height="76.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="329.0" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño carga la fecha real de inicio</text>
<rect x="345.0" y="416.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="453.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema recalcula la fecha de fin</text>
<text x="560.0" y="478.5" font-size="20" fill="#ffffff" text-anchor="middle">estimada desde el inicio real</text>
<rect x="345.0" y="558.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="595.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Durante la obra se cargan las etapas, los</text>
<text x="560.0" y="620.5" font-size="20" fill="#1d1d1f" text-anchor="middle">pedidos, los gastos y los cobros</text>
<polygon points="560,700.0 720.0,780.0 560,860.0 400.0,780.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="775.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Hay que</text>
<text x="560.0" y="797.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">interrumpir la obra?</text>
<polygon points="560,916.0 720.0,996.0 560,1076.0 400.0,996.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="991.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Se completó la</text>
<text x="560.0" y="1013.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">última etapa?</text>
<rect x="345.0" y="1132.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1169.5" font-size="20" fill="#ffffff" text-anchor="middle">La obra pasa a &quot;Finalizada&quot; y sus etapas</text>
<text x="560.0" y="1194.5" font-size="20" fill="#ffffff" text-anchor="middle">quedan bloqueadas</text>
<rect x="345.0" y="1274.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1310.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño revisa el balance de cierre:</text>
<text x="560.0" y="1335.5" font-size="20" fill="#1d1d1f" text-anchor="middle">ganancia estimada, resultado de caja y</text>
<text x="560.0" y="1360.5" font-size="20" fill="#1d1d1f" text-anchor="middle">saldo por cobrar</text>
<rect x="450.0" y="1439.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="1487.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="52.0" y="713.0" width="260" height="134.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="182.0" y="749.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño la cancela con</text>
<text x="182.0" y="774.5" font-size="20" fill="#1d1d1f" text-anchor="middle">el motivo y confirma</text>
<text x="182.0" y="799.5" font-size="20" fill="#1d1d1f" text-anchor="middle">que interrumpe una</text>
<text x="182.0" y="824.5" font-size="20" fill="#1d1d1f" text-anchor="middle">obra en marcha</text>
<rect x="52.0" y="893.0" width="260" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="182.0" y="929.5" font-size="20" fill="#ffffff" text-anchor="middle">La obra queda</text>
<text x="182.0" y="954.5" font-size="20" fill="#ffffff" text-anchor="middle">&quot;Cancelada&quot; y se</text>
<text x="182.0" y="979.5" font-size="20" fill="#ffffff" text-anchor="middle">registra en la auditoría</text>
<rect x="97.0" y="1048.0" width="170" height="70" rx="35.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="182.0" y="1090.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<polygon points="975,916.0 1120.0,996.0 975,1076.0 830.0,996.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="975.0" y="980.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El dueño la da</text>
<text x="975.0" y="1002.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">por terminada</text>
<text x="975.0" y="1024.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">igual?</text>
<rect x="810.0" y="1132.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1169.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Confirma que quedan etapas</text>
<text x="975.0" y="1194.5" font-size="20" fill="#1d1d1f" text-anchor="middle">sin completar</text>
<rect x="52.0" y="275.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="306.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Solo se puede cargar con el</text>
<text x="182.0" y="327.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">presupuesto definitivo</text>
<text x="182.0" y="348.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">aprobado</text>
<rect x="52.0" y="1292.7" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1323.7" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Cerrar la obra no cancela lo</text>
<text x="182.0" y="1344.5" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">que falta cobrar</text>
</svg>