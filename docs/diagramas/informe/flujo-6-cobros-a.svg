<path d="M 560.0 1776.0 L 560.0 1832.0" fill="none" stroke="#3a3a3a" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="520.0" y="1790.4" width="32.0" height="21.2" fill="#ffffff"/>
<text x="536.0" y="1809.1" font-size="17" text-anchor="middle" fill="#333333" font-weight="bold">No</text>
<path d="M 560.0 1902.0 L 560.0 1958.0" fill="none" stroke="#3a3a3a" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="450.0" y="128.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="345.0" y="266.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="303.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Con el definitivo aprobado, el dueño abre</text>
<text x="560.0" y="328.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Cobros y toca &quot;Generar plan&quot;</text>
<polygon points="560,408.0 730.0,493.0 560,578.0 390.0,493.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="477.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El presupuesto tiene</text>
<text x="560.0" y="499.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">definidos anticipo y</text>
<text x="560.0" y="521.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">cuotas?</text>
<rect x="345.0" y="634.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="671.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Indica la fecha del primer vencimiento,</text>
<text x="560.0" y="696.5" font-size="20" fill="#1d1d1f" text-anchor="middle">acordada con el cliente</text>
<rect x="345.0" y="776.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="812.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema arma el anticipo como cuota</text>
<text x="560.0" y="837.5" font-size="20" fill="#ffffff" text-anchor="middle">cero y las cuotas cada 15 días, con el total</text>
<text x="560.0" y="862.5" font-size="20" fill="#ffffff" text-anchor="middle">del presupuesto</text>
<rect x="345.0" y="941.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="978.5" font-size="20" fill="#ffffff" text-anchor="middle">Ajusta los centavos del redondeo en la</text>
<text x="560.0" y="1003.5" font-size="20" fill="#ffffff" text-anchor="middle">última cuota para que el plan cierre exacto</text>
<rect x="345.0" y="1083.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1119.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Cuando el cliente paga, el dueño registra el</text>
<text x="560.0" y="1144.5" font-size="20" fill="#1d1d1f" text-anchor="middle">pago: fecha, monto, medio de pago y</text>
<text x="560.0" y="1169.5" font-size="20" fill="#1d1d1f" text-anchor="middle">comprobante</text>
<polygon points="560,1248.0 725.0,1333.0 560,1418.0 395.0,1333.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1328.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El monto supera el</text>
<text x="560.0" y="1350.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">saldo de la cuota?</text>
<rect x="345.0" y="1474.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1511.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema guarda el pago, lo audita y lo</text>
<text x="560.0" y="1536.5" font-size="20" fill="#ffffff" text-anchor="middle">descuenta del saldo</text>
<polygon points="560,1616.0 720.0,1696.0 560,1776.0 400.0,1696.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1691.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿La cuota todavía</text>
<text x="560.0" y="1713.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">tiene saldo?</text>
<rect x="345.0" y="1832.0" width="430" height="70.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1874.0" font-size="20" fill="#ffffff" text-anchor="middle">La cuota queda &quot;Abonada&quot;</text>
<circle cx="560" cy="1988.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="1996.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="438.5" width="330" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="475.0" font-size="20" fill="#ffffff" text-anchor="middle">El sistema pide cargar el plan</text>
<text x="975.0" y="500.0" font-size="20" fill="#ffffff" text-anchor="middle">de pago en el presupuesto</text>
<text x="975.0" y="525.0" font-size="20" fill="#ffffff" text-anchor="middle">antes de generar el cobro</text>
<rect x="885.0" y="593.5" width="180" height="70" rx="35.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="975.0" y="635.9" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<circle cx="182" cy="1137.5" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="182.0" y="1145.9" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">B</text>
<rect x="810.0" y="1278.5" width="330" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1315.0" font-size="20" fill="#ffffff" text-anchor="middle">El sistema lo rechaza: no se</text>
<text x="975.0" y="1340.0" font-size="20" fill="#ffffff" text-anchor="middle">puede cobrar más de lo que se</text>
<text x="975.0" y="1365.0" font-size="20" fill="#ffffff" text-anchor="middle">debe</text>
<rect x="810.0" y="1654.0" width="330" height="84.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1690.5" font-size="20" fill="#ffffff" text-anchor="middle">La cuota queda &quot;Parcial&quot; con su</text>
<text x="975.0" y="1715.5" font-size="20" fill="#ffffff" text-anchor="middle">saldo</text>
<rect x="52.0" y="784.3" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="815.3" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Todos los montos salen del</text>
<text x="182.0" y="836.1" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">presupuesto aprobado: no se</text>
<text x="182.0" y="856.9" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">vuelven a escribir</text>
<rect x="52.0" y="1470.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1501.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Un pago mal cargado se anula</text>
<text x="182.0" y="1522.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">con motivo y la cuota vuelve a</text>
<text x="182.0" y="1543.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">deberse entera</text>
<rect x="52.0" y="1820.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1851.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El estado de la cuota sale de</text>
<text x="182.0" y="1872.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">sus pagos: nadie lo marca a</text>
<text x="182.0" y="1893.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">mano</text>
</svg>