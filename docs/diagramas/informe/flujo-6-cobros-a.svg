<path d="M 560.0 1418.0 L 560.0 1474.0" fill="none" stroke="#3a3a3a" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="520.0" y="1432.4" width="32.0" height="21.2" fill="#ffffff"/>
<text x="536.0" y="1451.1" font-size="17" text-anchor="middle" fill="#333333" font-weight="bold">No</text>
<path d="M 560.0 1560.0 L 560.0 1616.0" fill="none" stroke="#3a3a3a" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
