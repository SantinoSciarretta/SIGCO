<rect x="44" y="117" width="20" height="20" rx="4" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="74" y="132" font-size="15" fill="#444">Acción automática del sistema</text>
<circle cx="54" cy="157" r="10" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="54" y="161.5" font-size="12" font-weight="bold" fill="#2a2a2a" text-anchor="middle">A</text>
<text x="74" y="162" font-size="15" fill="#444">Conector con la otra parte</text>
