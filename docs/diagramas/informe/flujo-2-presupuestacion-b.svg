<circle cx="560" cy="198.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="206.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="345.0" y="284.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="320.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño define el porcentaje de</text>
<text x="560.0" y="345.5" font-size="20" fill="#1d1d1f" text-anchor="middle">honorarios, el anticipo y la cantidad de</text>
<text x="560.0" y="370.5" font-size="20" fill="#1d1d1f" text-anchor="middle">cuotas</text>
<polygon points="560,449.0 730.0,534.0 560,619.0 390.0,534.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="518.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Anticipo y cuotas</text>
<text x="560.0" y="540.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">cierran al 100% del</text>
<text x="560.0" y="562.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">total?</text>
<rect x="345.0" y="675.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="712.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Descarga el PDF con membrete y se lo</text>
<text x="560.0" y="737.5" font-size="20" fill="#1d1d1f" text-anchor="middle">manda al cliente por fuera del sistema</text>
<rect x="345.0" y="817.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="854.5" font-size="20" fill="#ffffff" text-anchor="middle">Al marcarlo enviado, el sistema verifica que</text>
<text x="560.0" y="879.5" font-size="20" fill="#ffffff" text-anchor="middle">tenga ítems y lo bloquea para edición</text>
<polygon points="560,959.0 720.0,1039.0 560,1119.0 400.0,1039.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1034.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El cliente lo</text>
<text x="560.0" y="1056.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">aprueba?</text>
<rect x="345.0" y="1175.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1212.5" font-size="20" fill="#ffffff" text-anchor="middle">Queda &quot;Aprobado&quot;, se audita y la obra</text>
<text x="560.0" y="1237.5" font-size="20" fill="#ffffff" text-anchor="middle">pasa sola a &quot;En ejecución&quot;</text>
<rect x="345.0" y="1317.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1354.5" font-size="20" fill="#ffffff" text-anchor="middle">Se habilitan Gastos, Compras,</text>
<text x="560.0" y="1379.5" font-size="20" fill="#ffffff" text-anchor="middle">Seguimiento y Cobros para la obra</text>
<rect x="450.0" y="1459.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="1507.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="810.0" y="491.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="528.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema no lo guarda y pide</text>
<text x="975.0" y="553.5" font-size="20" fill="#ffffff" text-anchor="middle">corregirlo</text>
<circle cx="975" cy="718.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="975.0" y="726.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">B</text>
<rect x="810.0" y="817.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="854.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Arma una versión nueva</text>
<text x="975.0" y="879.5" font-size="20" fill="#1d1d1f" text-anchor="middle">tomando la anterior como base</text>
<polygon points="975,969.0 1105.0,1039.0 975,1109.0 845.0,1039.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="975.0" y="1045.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Pide cambios?</text>
<rect x="810.0" y="1325.0" width="330" height="70.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1367.0" font-size="20" fill="#ffffff" text-anchor="middle">Queda &quot;Rechazado&quot;</text>
<rect x="52.0" y="671.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="702.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El PDF no muestra precios</text>
<text x="182.0" y="723.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">unitarios: solo los subtotales</text>
<text x="182.0" y="744.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">por rubro</text>
<rect x="52.0" y="992.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1023.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Pasarlo a aprobado es una</text>
<text x="182.0" y="1044.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">acción que solo puede hacer el</text>
<text x="182.0" y="1065.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">dueño</text>
<rect x="52.0" y="1171.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1202.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">No puede haber dos definitivos</text>
<text x="182.0" y="1223.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">aprobados: los cambios</text>
<text x="182.0" y="1244.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">posteriores van como adicional</text>
</svg>