<rect x="450.0" y="128.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="345.0" y="266.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="303.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Quien está en la obra detecta que falta</text>
<text x="560.0" y="328.5" font-size="20" fill="#1d1d1f" text-anchor="middle">material y abre un pedido nuevo</text>
<polygon points="560,408.0 720.0,488.0 560,568.0 400.0,488.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="483.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿La obra está en</text>
<text x="560.0" y="505.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">ejecución?</text>
<rect x="345.0" y="624.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="661.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige los materiales del catálogo y la</text>
<text x="560.0" y="686.5" font-size="20" fill="#1d1d1f" text-anchor="middle">cantidad de cada uno</text>
<polygon points="560,766.0 720.0,846.0 560,926.0 400.0,846.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="841.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El pedido lo carga</text>
<text x="560.0" y="863.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">el dueño?</text>
<rect x="345.0" y="982.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1018.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema controla que los materiales</text>
<text x="560.0" y="1043.5" font-size="20" fill="#ffffff" text-anchor="middle">estén activos y no se repitan, y registra</text>
<text x="560.0" y="1068.5" font-size="20" fill="#ffffff" text-anchor="middle">quién pidió</text>
<rect x="345.0" y="1147.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1184.5" font-size="20" fill="#ffffff" text-anchor="middle">El pedido queda &quot;Pendiente de aprobación&quot;</text>
<text x="560.0" y="1209.5" font-size="20" fill="#ffffff" text-anchor="middle">y aparece en el Tablero del dueño</text>
<rect x="345.0" y="1289.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1326.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño abre el pedido y toca &quot;Pedir</text>
<text x="560.0" y="1351.5" font-size="20" fill="#1d1d1f" text-anchor="middle">cotización&quot;</text>
<polygon points="560,1431.0 730.0,1516.0 560,1601.0 390.0,1516.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1500.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El teléfono del</text>
<text x="560.0" y="1522.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">corralón se puede</text>
<text x="560.0" y="1544.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">interpretar?</text>
<rect x="345.0" y="1657.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1693.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema abre WhatsApp con un mensaje</text>
<text x="560.0" y="1718.5" font-size="20" fill="#ffffff" text-anchor="middle">que lleva los materiales y las cantidades,</text>
<text x="560.0" y="1743.5" font-size="20" fill="#ffffff" text-anchor="middle">sin precios</text>
<rect x="345.0" y="1822.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1859.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño manda el mensaje desde su</text>
<text x="560.0" y="1884.5" font-size="20" fill="#1d1d1f" text-anchor="middle">teléfono y espera la respuesta del corralón</text>
<circle cx="560" cy="1994.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="2002.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="445.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="482.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema no permite pedir</text>
<text x="975.0" y="507.5" font-size="20" fill="#ffffff" text-anchor="middle">para esa obra</text>
<rect x="885.0" y="577.0" width="180" height="70" rx="35.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="975.0" y="619.4" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="810.0" y="803.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="840.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige el corralón al que le va a</text>
<text x="975.0" y="865.5" font-size="20" fill="#1d1d1f" text-anchor="middle">pedir precio</text>
<rect x="810.0" y="1473.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1510.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema avisa y muestra el</text>
<text x="975.0" y="1535.5" font-size="20" fill="#ffffff" text-anchor="middle">número para escribirle a mano</text>
<rect x="52.0" y="273.2" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="304.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Lo puede cargar el capataz</text>
<text x="182.0" y="325.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">desde el celular</text>
<rect x="52.0" y="799.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="830.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El capataz no ve los</text>
<text x="182.0" y="851.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">proveedores: el corralón lo</text>
<text x="182.0" y="872.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">elige el dueño al aprobar</text>
<rect x="52.0" y="1829.2" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1860.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">SIGCO no envía nada: el</text>
<text x="182.0" y="1881.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">mensaje lo manda una persona</text>
</svg>