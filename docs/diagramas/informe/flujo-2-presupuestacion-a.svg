<rect x="450.0" y="128.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="810.0" y="133.2" width="330" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="975.0" y="164.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">La obra tiene que estar &quot;En</text>
<text x="975.0" y="185.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">presupuestación&quot;</text>
<polygon points="560,260.0 730.0,345.0 560,430.0 390.0,345.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="329.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Hace falta dar</text>
<text x="560.0" y="351.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">primero un precio</text>
<text x="560.0" y="373.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">estimativo?</text>
<polygon points="560,480.0 730.0,565.0 560,650.0 390.0,565.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="549.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Es una reforma que</text>
<text x="560.0" y="571.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">necesita</text>
<text x="560.0" y="593.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">anteproyecto?</text>
<rect x="345.0" y="700.0" width="430" height="76.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="745.0" font-size="20" fill="#1d1d1f" text-anchor="middle">Crea el presupuesto definitivo</text>
<polygon points="560,826.0 720.0,906.0 560,986.0 400.0,906.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="901.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Parte de una</text>
<text x="560.0" y="923.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">versión anterior?</text>
<rect x="345.0" y="1036.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1073.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema numera la versión y toma el</text>
<text x="560.0" y="1098.5" font-size="20" fill="#ffffff" text-anchor="middle">plazo de la duración cargada en la obra</text>
<rect x="345.0" y="1172.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1208.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige un rubro y completa su planilla:</text>
<text x="560.0" y="1233.5" font-size="20" fill="#1d1d1f" text-anchor="middle">cantidad y precio de los materiales del</text>
<text x="560.0" y="1258.5" font-size="20" fill="#1d1d1f" text-anchor="middle">catálogo</text>
<polygon points="560,1331.0 725.0,1411.0 560,1491.0 395.0,1411.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1406.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Falta algo que no</text>
<text x="560.0" y="1428.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">está en el catálogo?</text>
<rect x="345.0" y="1541.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1577.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Carga la mano de obra, con un total por</text>
<text x="560.0" y="1602.5" font-size="20" fill="#1d1d1f" text-anchor="middle">rubro y subrubro, y los imprevistos, con un</text>
<text x="560.0" y="1627.5" font-size="20" fill="#1d1d1f" text-anchor="middle">porcentaje sobre cada rubro</text>
<rect x="345.0" y="1700.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1736.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema recalcula en el momento los</text>
<text x="560.0" y="1761.5" font-size="20" fill="#ffffff" text-anchor="middle">subtotales, los honorarios, el IVA (salvo la</text>
<text x="560.0" y="1786.5" font-size="20" fill="#ffffff" text-anchor="middle">mano de obra) y el total</text>
<polygon points="560,1859.0 720.0,1939.0 560,2019.0 400.0,1939.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1934.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Quedan rubros por</text>
<text x="560.0" y="1956.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">completar?</text>
<circle cx="560" cy="2099.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="2107.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="290.5" width="330" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="327.0" font-size="20" fill="#1d1d1f" text-anchor="middle">Arma la cotización inicial con los</text>
<text x="975.0" y="352.0" font-size="20" fill="#1d1d1f" text-anchor="middle">m² y el valor por m², y el</text>
<text x="975.0" y="377.0" font-size="20" fill="#1d1d1f" text-anchor="middle">sistema calcula el precio</text>
<rect x="810.0" y="522.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="559.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Arma el anteproyecto por rubro,</text>
<text x="975.0" y="584.5" font-size="20" fill="#1d1d1f" text-anchor="middle">con los planos del arquitecto</text>
<circle cx="975" cy="738.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="975.0" y="746.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">B</text>
<rect x="810.0" y="851.5" width="330" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="888.0" font-size="20" fill="#ffffff" text-anchor="middle">El sistema copia sus ítems en</text>
<text x="975.0" y="913.0" font-size="20" fill="#ffffff" text-anchor="middle">un presupuesto nuevo, sin tocar</text>
<text x="975.0" y="938.0" font-size="20" fill="#ffffff" text-anchor="middle">el original</text>
<rect x="810.0" y="1368.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1405.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Lo agrega como ítem suelto,</text>
<text x="975.0" y="1430.5" font-size="20" fill="#1d1d1f" text-anchor="middle">con su rubro y su unidad</text>
<rect x="90.0" y="518.8" width="220" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="200.0" y="549.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">En una construcción</text>
<text x="200.0" y="570.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">nueva el sistema no</text>
<text x="200.0" y="591.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">habilita el anteproyecto</text>
<rect x="90.0" y="1538.9" width="220" height="113.2" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="200.0" y="1569.9" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El monto de los</text>
<text x="200.0" y="1590.7" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">imprevistos se recalcula</text>
<text x="200.0" y="1611.5" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">solo cuando cambia el</text>
<text x="200.0" y="1632.3" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">rubro</text>
</svg>