<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="345.0" y="266.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="303.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Llega la consulta de un cliente y el dueño</text>
<text x="560.0" y="328.5" font-size="20" fill="#1d1d1f" text-anchor="middle">abre el alta de una obra nueva</text>
<polygon points="560,408.0 720.0,488.0 560,568.0 400.0,488.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="483.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El cliente ya está</text>
<text x="560.0" y="505.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">cargado?</text>
<rect x="345.0" y="624.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="661.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige el cliente y carga la dirección, el tipo</text>
<text x="560.0" y="686.5" font-size="20" fill="#1d1d1f" text-anchor="middle">de inmueble y el tipo de obra</text>
<rect x="345.0" y="766.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="803.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Si ya lo sabe, indica cuándo estima</text>
<text x="560.0" y="828.5" font-size="20" fill="#1d1d1f" text-anchor="middle">arrancar y cuántos meses va a durar</text>
<rect x="345.0" y="908.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="944.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema guarda la obra &quot;En</text>
<text x="560.0" y="969.5" font-size="20" fill="#ffffff" text-anchor="middle">presupuestación&quot; y, si hay plazo, calcula la</text>
<text x="560.0" y="994.5" font-size="20" fill="#ffffff" text-anchor="middle">fecha de fin estimada</text>
<rect x="345.0" y="1073.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1110.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño arma los presupuestos y se los</text>
<text x="560.0" y="1135.5" font-size="20" fill="#1d1d1f" text-anchor="middle">manda al cliente</text>
<polygon points="560,1215.0 730.0,1300.0 560,1385.0 390.0,1300.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1284.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿El cliente aprobó el</text>
<text x="560.0" y="1306.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">presupuesto</text>
<text x="560.0" y="1328.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">definitivo?</text>
<rect x="345.0" y="1441.0" width="430" height="76.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1486.0" font-size="20" fill="#ffffff" text-anchor="middle">La obra pasa sola a &quot;En ejecución&quot;</text>
<circle cx="560" cy="1603.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="1611.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="433.5" width="330" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="470.0" font-size="20" fill="#1d1d1f" text-anchor="middle">Lo da de alta desde el mismo</text>
<text x="975.0" y="495.0" font-size="20" fill="#1d1d1f" text-anchor="middle">formulario, con sus datos y</text>
<text x="975.0" y="520.0" font-size="20" fill="#1d1d1f" text-anchor="middle">quién lo recomendó</text>
<polygon points="975,1225.0 1110.0,1300.0 975,1375.0 840.0,1300.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="975.0" y="1295.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Sigue la</text>
<text x="975.0" y="1317.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">negociación?</text>
<rect x="810.0" y="1431.0" width="330" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1468.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño cancela la obra e</text>
<text x="975.0" y="1493.5" font-size="20" fill="#1d1d1f" text-anchor="middle">indica el motivo</text>
<rect x="810.0" y="1573.0" width="330" height="70.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="1615.0" font-size="20" fill="#ffffff" text-anchor="middle">La obra queda &quot;Cancelada&quot;</text>
<rect x="885.0" y="1699.0" width="180" height="70" rx="35.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="975.0" y="1741.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="52.0" y="620.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="651.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El tipo de obra se puede</text>
<text x="182.0" y="672.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">corregir mientras la obra no</text>
<text x="182.0" y="693.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">tenga presupuestos</text>
<rect x="52.0" y="1080.2" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1111.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Ver el Proceso de</text>
<text x="182.0" y="1132.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Presupuestación</text>
</svg>