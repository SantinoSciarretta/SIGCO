<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="345.0" y="266.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="303.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Cuando se produce un gasto, el dueño lo</text>
<text x="560.0" y="328.5" font-size="20" fill="#1d1d1f" text-anchor="middle">registra desde la computadora o el celular</text>
<polygon points="560,408.0 735.0,498.0 560,588.0 385.0,498.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="482.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿La obra está en</text>
<text x="560.0" y="504.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">ejecución con el</text>
<text x="560.0" y="526.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">definitivo aprobado?</text>
<rect x="345.0" y="644.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="681.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige la obra, el rubro y, si quiere, el</text>
<text x="560.0" y="706.5" font-size="20" fill="#1d1d1f" text-anchor="middle">subrubro, del catálogo de Presupuestación</text>
<rect x="345.0" y="786.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="822.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Indica el tipo de gasto (material, mano de</text>
<text x="560.0" y="847.5" font-size="20" fill="#1d1d1f" text-anchor="middle">obra, gasto hormiga u otro), el monto y la</text>
<text x="560.0" y="872.5" font-size="20" fill="#1d1d1f" text-anchor="middle">fecha</text>
<polygon points="560,951.0 720.0,1031.0 560,1111.0 400.0,1031.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1026.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Es un pago de</text>
<text x="560.0" y="1048.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">mano de obra?</text>
<polygon points="560,1167.0 720.0,1247.0 560,1327.0 400.0,1247.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1242.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Tiene</text>
<text x="560.0" y="1264.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">comprobante?</text>
<rect x="345.0" y="1383.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1420.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema guarda el gasto y registra quién</text>
<text x="560.0" y="1445.5" font-size="20" fill="#ffffff" text-anchor="middle">lo cargó</text>
<circle cx="560" cy="1555.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="1563.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="443.5" width="330" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="480.0" font-size="20" fill="#ffffff" text-anchor="middle">El sistema no admite el gasto:</text>
<text x="975.0" y="505.0" font-size="20" fill="#ffffff" text-anchor="middle">todavía no hay presupuesto</text>
<text x="975.0" y="530.0" font-size="20" fill="#ffffff" text-anchor="middle">contra el que compararlo</text>
<rect x="885.0" y="598.5" width="180" height="70" rx="35.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="975.0" y="640.9" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="810.0" y="989.0" width="330" height="84.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1025.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Lo asocia al operario que lo</text>
<text x="975.0" y="1050.5" font-size="20" fill="#1d1d1f" text-anchor="middle">cobró</text>
<rect x="810.0" y="1209.0" width="330" height="76.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="1254.0" font-size="20" fill="#1d1d1f" text-anchor="middle">Le saca una foto y la adjunta</text>
<rect x="52.0" y="262.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="293.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Las compras de materiales no</text>
<text x="182.0" y="314.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">se cargan acá: las genera</text>
<text x="182.0" y="335.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Compras al aprobar el pedido</text>
<rect x="52.0" y="651.2" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="682.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El subrubro tiene que</text>
<text x="182.0" y="703.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">pertenecer al rubro elegido</text>
</svg>