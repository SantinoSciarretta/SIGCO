<rect x="450.0" y="128.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="176.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">INICIO</text>
<rect x="345.0" y="266.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="303.5" font-size="20" fill="#ffffff" text-anchor="middle">La obra pasa a &quot;En ejecución&quot; al aprobarse</text>
<text x="560.0" y="328.5" font-size="20" fill="#ffffff" text-anchor="middle">su presupuesto definitivo</text>
<rect x="345.0" y="408.0" width="430" height="84.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="444.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño abre la pestaña de etapas de la</text>
<text x="560.0" y="469.5" font-size="20" fill="#1d1d1f" text-anchor="middle">obra</text>
<polygon points="560,548.0 720.0,628.0 560,708.0 400.0,628.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="623.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Usa una plantilla</text>
<text x="560.0" y="645.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">de etapas típicas?</text>
<rect x="345.0" y="764.0" width="430" height="109.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="800.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Para cada etapa indica qué hay que hacer,</text>
<text x="560.0" y="825.5" font-size="20" fill="#1d1d1f" text-anchor="middle">el rubro, los días que lleva y, si se</text>
<text x="560.0" y="850.5" font-size="20" fill="#1d1d1f" text-anchor="middle">superpone con otra, la fecha de inicio</text>
<rect x="345.0" y="929.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="966.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema reparte el 100% del avance en</text>
<text x="560.0" y="991.5" font-size="20" fill="#ffffff" text-anchor="middle">proporción a la duración de cada etapa</text>
<rect x="345.0" y="1071.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1107.5" font-size="20" fill="#ffffff" text-anchor="middle">Ordena las etapas por fecha de inicio y</text>
<text x="560.0" y="1132.5" font-size="20" fill="#ffffff" text-anchor="middle">calcula cuándo empieza y termina cada</text>
<text x="560.0" y="1157.5" font-size="20" fill="#ffffff" text-anchor="middle">una</text>
<rect x="345.0" y="1236.0" width="430" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1273.5" font-size="20" fill="#ffffff" text-anchor="middle">Las etapas quedan pendientes y el avance</text>
<text x="560.0" y="1298.5" font-size="20" fill="#ffffff" text-anchor="middle">físico arranca en 0%</text>
<circle cx="560" cy="1408.0" r="30.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.2"/>
<text x="560.0" y="1416.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">A</text>
<rect x="810.0" y="586.0" width="330" height="84.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="622.5" font-size="20" fill="#1d1d1f" text-anchor="middle">Elige una de las plantillas</text>
<text x="975.0" y="647.5" font-size="20" fill="#1d1d1f" text-anchor="middle">guardadas</text>
<rect x="810.0" y="726.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="763.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema crea las etapas con</text>
<text x="975.0" y="788.5" font-size="20" fill="#ffffff" text-anchor="middle">los porcentajes de la plantilla</text>
<rect x="52.0" y="414.2" width="260" height="71.6" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="445.2" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Solo una obra en ejecución</text>
<text x="182.0" y="466.0" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">admite etapas</text>
<rect x="52.0" y="772.3" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="803.3" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">También se pueden cargar los</text>
<text x="182.0" y="824.1" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">porcentajes a mano, siempre</text>
<text x="182.0" y="844.9" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">que sumen 100</text>
<rect x="52.0" y="925.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="956.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El centavo que sobra del</text>
<text x="182.0" y="977.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">redondeo va a la etapa más</text>
<text x="182.0" y="998.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">larga</text>
<rect x="52.0" y="1079.3" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1110.3" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Una etapa sin fecha arranca el</text>
<text x="182.0" y="1131.1" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">día siguiente a que termina la</text>
<text x="182.0" y="1151.9" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">anterior</text>
<rect x="52.0" y="1232.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="1263.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">Si ya hay una etapa</text>
<text x="182.0" y="1284.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">completada, las etapas no se</text>
<text x="182.0" y="1305.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">pueden redefinir</text>
</svg>