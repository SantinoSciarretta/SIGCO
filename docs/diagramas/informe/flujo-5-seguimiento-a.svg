<path d="M 560.0 708.0 L 560.0 764.0" fill="none" stroke="#3a3a3a" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="520.0" y="722.4" width="32.0" height="21.2" fill="#ffffff"/>
