<text x="560.0" y="353.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Corresponde</text>
<text x="560.0" y="375.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">actualizar por CAC</text>
<text x="560.0" y="397.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">este mes?</text>
<rect x="345.0" y="967.0" width="430" height="86.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="560.0" y="1004.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño genera la planilla de pagos en</text>
<text x="560.0" y="1029.5" font-size="20" fill="#1d1d1f" text-anchor="middle">PDF y se la manda al cliente</text>
<rect x="345.0" y="1109.0" width="430" height="109.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1145.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema marca vencidas las cuotas con</text>
<text x="560.0" y="1170.5" font-size="20" fill="#ffffff" text-anchor="middle">saldo y fecha pasada, y avisa las que</text>
<text x="560.0" y="1195.5" font-size="20" fill="#ffffff" text-anchor="middle">vencen en los próximos 7 días</text>
<polygon points="560,1274.0 720.0,1354.0 560,1434.0 400.0,1354.0" fill="#ffffff" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="560.0" y="1349.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">¿Quedan cuotas por</text>
<text x="560.0" y="1371.3" font-size="18" fill="#2a2a2a" text-anchor="middle" font-weight="bold">cobrar?</text>
<rect x="345.0" y="1490.0" width="430" height="70.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="560.0" y="1532.0" font-size="20" fill="#ffffff" text-anchor="middle">La obra queda sin saldo por cobrar</text>
<rect x="450.0" y="1616.0" width="220" height="82" rx="41.0" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
<text x="560.0" y="1664.3" font-size="21" fill="#2a2a2a" text-anchor="middle" font-weight="bold">FIN</text>
<rect x="810.0" y="327.0" width="330" height="84.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="363.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño carga el coeficiente</text>
<text x="975.0" y="388.5" font-size="20" fill="#1d1d1f" text-anchor="middle">del mes</text>
<rect x="810.0" y="467.0" width="330" height="86.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="504.5" font-size="20" fill="#ffffff" text-anchor="middle">El sistema muestra en pesos</text>
<text x="975.0" y="529.5" font-size="20" fill="#ffffff" text-anchor="middle">cuánto pasa a deberse</text>
<rect x="810.0" y="609.0" width="330" height="84.0" rx="10" fill="#e8e0f6" stroke="#d6c9ef" stroke-width="1.2"/>
<text x="975.0" y="645.5" font-size="20" fill="#1d1d1f" text-anchor="middle">El dueño revisa el monto y</text>
<text x="975.0" y="670.5" font-size="20" fill="#1d1d1f" text-anchor="middle">confirma</text>
<rect x="810.0" y="749.0" width="330" height="134.0" rx="10" fill="#4b2a83" stroke="#3c1f6e" stroke-width="1.2"/>
<text x="975.0" y="785.5" font-size="20" fill="#ffffff" text-anchor="middle">Actualiza solo el saldo impago</text>
<text x="975.0" y="810.5" font-size="20" fill="#ffffff" text-anchor="middle">de las cuotas pendientes. El</text>
<text x="975.0" y="835.5" font-size="20" fill="#ffffff" text-anchor="middle">mismo coeficiente no se aplica</text>
<text x="975.0" y="860.5" font-size="20" fill="#ffffff" text-anchor="middle">dos veces</text>
