<text x="182.0" y="1362.4" font-size="24" fill="#2a2a2a" text-anchor="middle" font-weight="bold">B</text>
<rect x="52.0" y="322.8" width="260" height="92.4" rx="6" fill="#f1f1f3" stroke="#b5b5ba" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="182.0" y="353.8" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">El coeficiente es por cuánto se</text>
<text x="182.0" y="374.6" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">multiplica el saldo: 1,04 es un</text>
<text x="182.0" y="395.4" font-size="16" fill="#555559" text-anchor="middle" font-style="italic">aumento del 4%</text>
