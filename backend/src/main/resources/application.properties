spring.application.name=sigco-backend

# ============================================================
#  Configuracion comun a todos los entornos
#  Lo especifico de cada uno vive en application-dev.properties
#  y application-prod.properties
# ============================================================

# ---------- Credenciales ----------
# Carga el archivo .env (no versionado) como fuente de propiedades.
# El prefijo "optional:" hace que la aplicacion arranque igual si el archivo
# no existe, que es el caso en produccion: alli las variables las inyecta
# la plataforma de hosting (Railway) desde su propio panel.
spring.config.import=optional:file:.env[.properties]

# Perfil activo. Por defecto "dev"; en produccion se sobreescribe con la
# variable de entorno SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Base de datos ----------
# Ningun valor real esta escrito aca: todos vienen del .env o del entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# validate: Hibernate NO crea ni modifica tablas. Al arrancar compara las
# entidades Java contra el esquema real (creado por Flyway) y, si algo no
# coincide, impide que la aplicacion inicie indicando que campo difiere.
# Es lo que mantiene el codigo alineado con el Diccionario de Datos.
spring.jpa.hibernate.ddl-auto=validate

# open-in-view=false: cierra la sesion de Hibernate al terminar el servicio,
# antes de armar la respuesta JSON. Con el valor por defecto (true), una
# relacion no cargada se cargaria sola durante la serializacion, disparando
# consultas invisibles a la base. Con false, si falta un dato, el error salta
# en desarrollo y obliga a resolverlo de forma explicita en el servicio.
spring.jpa.open-in-view=false

# ---------- Flyway ----------
# Ejecuta en orden las migraciones de db/migration al arrancar y registra
# cuales ya aplico. Un archivo ya aplicado no se edita nunca: se agrega uno
# nuevo con el numero siguiente.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Seguridad (modulo 14: Accesos) ----------
# Clave con la que se firman los tokens JWT. NO esta escrita aca: viene del .env
# en desarrollo y de las variables de entorno de Railway en produccion. Si se
# filtrara, cualquiera podria fabricar un token valido y entrar como quien
# quisiera, asi que no puede estar en el repositorio.
#
# HMAC-SHA256 exige al menos 32 caracteres; con menos, la aplicacion no arranca.
sigco.jwt.secreto=${JWT_SECRETO}

# Duracion del token: 8 horas, una jornada de trabajo. Mas corto obligaria al
# dueño a volver a entrar en medio del dia; mas largo alarga la ventana en la
# que un token robado sigue sirviendo.
sigco.jwt.duracion-segundos=28800

# ---------- Limite de intentos de ingreso ----------
# Cuantos intentos fallidos CONSECUTIVOS se toleran antes de bloquear la cuenta,
# y por cuanto tiempo queda bloqueada.
#
# Cinco deja lugar a equivocarse escribiendo —mayusculas activadas, un dedo
# corrido— sin que el sistema se vuelva molesto. Quince minutos alcanza para
# frenar a quien prueba contrasenas (baja el ritmo a veinte por hora, con lo que
# adivinar deja de ser viable) y es poco para quien se olvido la suya: espera y
# vuelve, sin tener que llamar a nadie.
#
# El bloqueo es por cuenta, y eso significa que alguien puede dejar afuera al
# dueño a proposito fallando cinco veces contra su usuario. Se acepta: dura
# quince minutos, se libera solo y queda anotado en la auditoria.
sigco.seguridad.intentos-maximos=5
sigco.seguridad.minutos-bloqueo=15

# ---------- Almacenamiento de archivos ----------
# Donde se guardan las fotos de remitos, los comprobantes de gastos y las
# imagenes del portfolio. La base guarda SOLO la referencia, nunca el binario.
#
#   local    -> una carpeta de la maquina. Es el valor por defecto y el de
#               desarrollo: permite probar el circuito completo sin una cuenta
#               de Supabase ni conexion a internet.
#   supabase -> Supabase Storage, que es lo que define la Propuesta Tecnica
#               para produccion.
#
# Cambiar de uno a otro es cambiar esta linea: el codigo que sube una foto no
# sabe donde termina.
sigco.almacenamiento.tipo=${ALMACENAMIENTO_TIPO:local}
sigco.almacenamiento.carpeta=${ALMACENAMIENTO_CARPETA:archivos}

# Tamano maximo de subida. Una foto de celular ronda los 3 o 4 MB; el limite
# deja margen sin permitir que alguien mande un video al servidor. El limite
# real lo vuelve a verificar ValidadorDeArchivos: este solo evita que Tomcat
# llegue a leer entero un archivo enorme.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
