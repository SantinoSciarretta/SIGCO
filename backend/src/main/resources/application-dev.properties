# ============================================================
#  Perfil DEV - desarrollo en la maquina local
#  Base de datos: PostgreSQL local (sigco_dev)
# ============================================================

# ---------- Diagnostico ----------
# Muestra en consola cada consulta SQL que genera Hibernate, formateada.
# Sirve para entender que esta haciendo JPA por debajo: cuantas consultas
# dispara una operacion y con que parametros.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Devuelve el mensaje del error en la respuesta HTTP. Comodo para desarrollar,
# desactivado en produccion para no exponer detalles internos.
server.error.include-message=always
server.error.include-binding-errors=always

# ---------- CORS ----------
# Origen desde el que el navegador puede llamar a esta API.
# 5173 es el puerto por defecto del servidor de desarrollo de Vite.
sigco.cors.origenes-permitidos=http://localhost:5173
