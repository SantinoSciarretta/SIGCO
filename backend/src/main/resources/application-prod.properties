# ============================================================
#  Perfil PROD - despliegue en Railway
#  Base de datos: PostgreSQL de Supabase
#  Las credenciales las inyecta Railway como variables de entorno.
# ============================================================

# ---------- Puerto ----------
# Railway asigna el puerto por la variable PORT y espera que la aplicacion
# escuche exactamente ahi. Si la aplicacion se quedara en el 8080 fijo, Railway
# no encontraria el servicio y lo marcaria como caido.
server.port=${PORT:8080}

# ---------- Base de datos ----------
# El pool por defecto abre hasta 10 conexiones. El plan gratuito de Supabase
# admite pocas conexiones simultaneas, y si el backend las toma todas, las
# migraciones de Flyway o una segunda copia del servicio se quedan esperando.
spring.datasource.hikari.maximum-pool-size=5

# ---------- Diagnostico ----------
# El SQL no se registra en produccion: llena los logs y puede dejar
# expuestos datos de la empresa en la salida del servidor.
spring.jpa.show-sql=false

# No se devuelve al cliente el detalle interno de los errores. Un mensaje de
# excepcion puede revelar nombres de tablas o la estructura del sistema.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------- CORS ----------
# Unico origen habilitado: el dominio del frontend publicado en Vercel.
sigco.cors.origenes-permitidos=${FRONTEND_URL}

# ---------- Almacenamiento ----------
# En produccion, Supabase Storage. El disco de Railway NO sirve: reinicia los
# contenedores y el disco se pierde con cada reinicio, asi que las fotos
# desaparecerian.
#
# Hay que crear DOS buckets en Supabase:
#   sigco-publico  (marcado como publico)  -> fotos del portfolio
#   sigco-privado  (privado)               -> remitos y comprobantes
#
# La clave es la "service_role" del proyecto, NO la anonima: la anonima no
# puede escribir en un bucket privado. Va como variable de entorno en Railway y
# nunca en el repositorio.
#
# El tipo se puede sobreescribir por variable de entorno aunque el valor por
# defecto en produccion sea supabase. Hace falta para poder arrancar el .jar con
# este perfil y verificar el resto de la configuracion sin credenciales de
# Supabase — que es como se probo antes de publicar.
sigco.almacenamiento.tipo=${ALMACENAMIENTO_TIPO:supabase}

# Estas dos NO llevan valor por defecto a proposito: si faltan, la aplicacion no
# arranca y dice cual falta. Un valor vacio la dejaria arrancar y fallar recien
# cuando alguien intente subir la primera foto, que es mucho peor.
sigco.almacenamiento.supabase.url=${SUPABASE_URL:}
sigco.almacenamiento.supabase.clave=${SUPABASE_SERVICE_KEY:}
