<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2d3d" />
    <title>SIGCO - Gránica SRL</title>

    <!--
      Icono de la pestaña: solo el isotipo, la G.

      El logo completo mide 930 x 99,5 y a 32 px de alto, que es el tamaño real
      del icono, la palabra no se leería. public/favicon.svg se genera a partir
      de src/assets/granica-logo.svg quedándose con los dos trazos de la G.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Tipografía del sistema de diseño.
      Barlow Condensed para cifras y títulos, Barlow para el texto corrido.
      Se carga desde Google Fonts; si no estuviera disponible, el sistema cae
      en la fuente del sistema operativo (ver --font-body en tokens.css).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap"
    />
  </head>
  <body>
    <!-- React monta toda la aplicacion dentro de este unico div (ver src/main.jsx). -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
